name: Linux Dockerfile tests

on:
  workflow_dispatch:
  push:
    branches: ['rc-0438-*', master]

permissions:
  contents: read

jobs:
  dockerfile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-k38-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-k38-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Tauri v2 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf build-essential pkg-config

      # tauri::generate_context! also needs src-tauri/icons/icon.png on Linux.
      # It is not tracked (tauri.conf.json lists only icons/icon.ico), so derive
      # an RGBA PNG from the tracked .ico; the tests never look at its pixels.
      - name: Derive Linux window icon from icon.ico
        run: |
          sudo apt-get install -y imagemagick
          convert 'src-tauri/icons/icon.ico[0]' -background none -resize 128x128 PNG32:src-tauri/icons/icon.png
          file src-tauri/icons/icon.png

      - name: Install frontend dependencies
        run: npm ci

      # tauri::generate_context! reads frontendDist at compile time, so the
      # Rust tests cannot build until dist/ exists.
      - name: Build frontend
        run: npm run build

      # These two tests are #[cfg(target_os = "linux")], so the Windows job in
      # build.yml never runs them. Gate on the per-test result lines: several
      # test binaries print a `test result` line and one of them can be a
      # 0-test binary, so a summary-line count is not evidence.
      - name: Run Linux-only Dockerfile tests
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --release -- k38_tests::the_source_patch_runs_and_every_miss_fails_the_build k38_tests::the_dist_check_passes_only_a_patched_build --nocapture 2>&1 | tee "$RUNNER_TEMP/k38-test.log"
          ran=$(grep -cE '^test .*k38_tests::(the_source_patch_runs_and_every_miss_fails_the_build|the_dist_check_passes_only_a_patched_build) \.\.\. ok$' "$RUNNER_TEMP/k38-test.log" || true)
          grep -E '^test .*k38_tests::' "$RUNNER_TEMP/k38-test.log"
          echo "k38 tests passed: $ran"
          if [ "$ran" -ne 2 ]; then echo "EXPECTED EXACTLY 2 K38 TESTS OK, GOT $ran"; exit 1; fi
